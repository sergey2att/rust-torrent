[workspace]
resolver = "2"
members = ["crates/*"]

# Крейты будущих этапов (создаются своими этапами, members = ["crates/*"] подхватит их сам):
#   tracker       — HTTP-announce (этап 2), UDP-announce (этап 4)
#   peer-wire     — handshake + фрейминг сообщений пиров (этапы 2, 6)
#   engine        — менеджер кусков, дисковый слой, оркестрация (этапы 3, 4)
#   dht           — Kademlia DHT (этап 5)
#   ext-metadata  — extension protocol + ut_metadata (этап 5)
#   ext-pex       — ut_pex (этап 6)
#   nat           — UPnP/NAT-PMP (этап 6)

[workspace.package]
edition = "2021"

[workspace.dependencies]
thiserror = "1"
sha1 = "0.10"
hex = "0.4"

# Линты: дефолт clippy + наши стилевые правила проекта.
# Дефолтные (warn by default) остаются; здесь — надбавка.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Стиль проекта: никаких unwrap/expect в библиотечных крейтах.
# В тестах разрешается локально (#![allow] в шапке тест-файла).
unwrap_used = "deny"
expect_used = "deny"
# Строгий набор поверх дефолта; отдельные шумные линты выключаем ниже по мере надобности.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
