[workspace]
resolver = "2"
members = ["crates/*"]

# Этап 8: Tauri-приложение (app/src-tauri) добавляется в members явно —
# crates/* его не подхватит.

[workspace.package]
edition = "2021"

[workspace.dependencies]
thiserror = "1"
sha1 = "0.10"
hex = "0.4"
tokio = { version = "1", default-features = false }
reqwest = "0.12"
percent-encoding = "2"
url = "2"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Линты: дефолт clippy + наши стилевые правила проекта.
# Дефолтные (warn by default) остаются; здесь — надбавка.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Стиль проекта: никаких unwrap/expect в библиотечных крейтах.
# В тестах разрешается локально (#![allow] в шапке тест-файла).
unwrap_used = "deny"
expect_used = "deny"
# Строгий набор поверх дефолта; отдельные шумные линты выключаем ниже по мере надобности.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
